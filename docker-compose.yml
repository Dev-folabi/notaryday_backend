services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # One-shot migration runner. `up` will not start API/worker until this
  # completes successfully.
  migrate:
    image: ghcr.io/dev-folabi/notaryday_backend:latest
    restart: "no"
    env_file:
      - .env
    command: ["npx", "prisma", "migrate", "deploy"]

  notaryday-api:
    image: ghcr.io/dev-folabi/notaryday_backend:latest
    restart: unless-stopped
    build:
      context: .
      target: production
    env_file:
      - .env
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["node", "dist/src/main"]

  notaryday-worker:
    image: ghcr.io/dev-folabi/notaryday_backend:latest
    restart: unless-stopped
    build:
      context: .
      target: production
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["node", "dist/src/main-worker"]
    healthcheck:
      disable: true

volumes:
  redis_data: